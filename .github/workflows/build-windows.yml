name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Assemble app HTML
        shell: pwsh
        run: |
          $parts = @(
            'app/p1c0.txt','app/p1c1.txt','app/p1c2.txt',
            'app/p2c0.txt','app/p2c1.txt','app/p2c2.txt'
          )
          Get-Content $parts -Raw | Set-Content -NoNewline -Encoding utf8 app/index.html
          $bytes = [System.IO.File]::ReadAllBytes('app/index.html')
          if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
            $bytes = $bytes[3..($bytes.Length-1)]
            [System.IO.File]::WriteAllBytes('app/index.html', $bytes)
          }
          Write-Host "Assembled size:" (Get-Item app/index.html).Length

      - name: Install dependencies
        run: npm install

      - name: Build Windows packages
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist/*.exe
            dist/**/*.exe
          if-no-files-found: warn

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
